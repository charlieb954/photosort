[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "photosort"
dynamic = ["version"]
description = "photosort is minimal command line python application to sort photos based on EXIF data whilst avoiding duplicates using hashing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyExifTool>=0.5.6", "rich>=13.7.1", "typer>=0.20.0"]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0", "ruff>=0.12.0"]

[tool.uv]
package = true

[tool.ruff]
exclude = ["*.ipynb"]
indent-width = 4
line-length = 79

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [
    "D1",  # docstring
    "E",   # pycodestyle
    "ERA", # commented out code
    "I",   # isort
    "W",   # pycodestyle
    "ANN", # missing type annotation
]

[project.scripts]
# This maps the command 'photosort' to the function 'main' in cli.py
photosort = "photosort.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--cov=photosort", "--cov-report=term-missing"]

[tool.setuptools_scm]
